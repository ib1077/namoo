<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="theme-color" content="#00589b">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="駅IC案内">
  <meta name="description" content="智頭急行線のICカード利用案内デジタルサイネージ">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.svg">
  <link rel="stylesheet" href="./style.css">
  <title>駅IC案内用サイネージ</title>
</head>
<body>
  <main id="app">
    <section id="reader" class="reader" hidden aria-live="polite">
      <img id="page-image" alt="" draggable="false">
      <span id="page-number" class="page-number"></span>
    </section>

    <section id="start-screen" class="start-screen">
      <div class="start-card">
        <img class="start-icon" src="./icons/icon.svg" alt="">
        <p class="eyebrow">智頭急行線</p>
        <h1>ICカード<br>ご利用案内</h1>
        <p id="status">案内を読み込んでいます…</p>
        <button id="station-button" class="start-button" type="button" disabled>案内を開始</button>
        <p class="hint">最初に1回だけ押してください</p>
      </div>
      <button id="dadada-button" class="secret-entry" type="button" disabled aria-label="だっだぁーを開く">だっだぁー 🐸</button>
    </section>

    <button id="pause-button" class="corner-button" type="button" aria-label="一時停止" hidden>Ⅱ</button>
    <section id="resume-screen" class="resume-screen" hidden>
      <button id="resume-button" type="button">つづける</button>
      <button id="home-button" type="button">タイトルへ戻る</button>
    </section>
  </main>
  <script src="./app.js" defer></script>
</body>
</html>

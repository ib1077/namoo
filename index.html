<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="theme-color" content="#101827">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="こっそりだっだぁー">
  <meta name="description" content="3枚を自動で読み上げるデジタルサイネージ">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" type="image/svg+xml" href="./icons/icon.svg">
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.svg">
  <link rel="stylesheet" href="./style.css">
  <title>こっそりだっだぁー</title>
</head>
<body>
  <main id="app">
    <section id="signage" class="signage" hidden aria-live="polite">
      <img id="slide-image" alt="" draggable="false">
      <div class="text-panel">
        <p id="slide-text"></p>
        <span id="slide-counter"></span>
      </div>
    </section>

    <section id="start-screen" class="overlay">
      <div class="card">
        <img src="./icons/icon.svg" alt="" class="logo">
        <h1>こっそり<br>だっだぁー</h1>
        <p id="status">3まいを よみこんでいます…</p>
        <button id="start-button" type="button" disabled>はじめる</button>
        <small>さいしょに 1かいだけ おしてください</small>
      </div>
    </section>

    <button id="pause-button" class="pause" type="button" aria-label="一時停止" hidden>Ⅱ</button>
    <section id="resume-screen" class="overlay resume" hidden>
      <button id="resume-button" type="button">つづきを よむ</button>
    </section>
  </main>
  <script src="./app.js" defer></script>
</body>
</html>

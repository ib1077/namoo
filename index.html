<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#fff4d6">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="おはなしえほん">
  <meta name="description" content="1回のタップで始まる、読み上げ自動めくり絵本">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.svg">
  <link rel="stylesheet" href="./style.css">
  <title>おはなしえほん</title>
</head>
<body>
  <main id="app" aria-live="polite">
    <section id="reader" class="reader" hidden>
      <img id="page-image" alt="" draggable="false">
      <div class="caption-wrap">
        <p id="page-text" class="caption"></p>
        <p id="page-number" class="page-number" aria-label="ページ番号"></p>
      </div>
    </section>

    <section id="start-screen" class="start-screen">
      <div class="start-card">
        <img class="start-icon" src="./icons/icon.svg" alt="">
        <h1>おはなしえほん</h1>
        <p id="status">えほんを よみこんでいます…</p>
        <button id="start-button" type="button" disabled>えほんを はじめる</button>
        <p class="hint">さいしょに 1かいだけ おしてください</p>
      </div>
    </section>

    <button id="pause-button" class="corner-button" type="button" aria-label="一時停止" hidden>Ⅱ</button>
    <div id="resume-screen" class="resume-screen" hidden>
      <button id="resume-button" type="button">つづきを よむ</button>
    </div>
  </main>
  <script src="./app.js" defer></script>
</body>
</html>
